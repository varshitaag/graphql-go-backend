version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notesdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: .
    restart: always
    depends_on:
      - postgres
    environment:
      PORT: 8080
      DATABASE_URL: "postgres://notes:notes@postgres:5432/notesdb?sslmode=disable"
    ports:
      - "8080:8080"

volumes:
  pgdata:
